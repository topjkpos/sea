<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underwater Artifact Restoration Robot</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            background-color: #050505; color: white;
            font-family: "PingFang TC", "Microsoft JhengHei", serif;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #001a33 0%, #050505 100%);
            z-index: 1;
        }
        .content { position: relative; z-index: 10; text-align: center; width: 95%; max-width: 1200px; }
        .chalice-logo { width: 60px; height: 60px; fill: #d4af37; margin-bottom: 10px; }
        h1 { font-size: 1.8rem; letter-spacing: 4px; font-weight: 200; margin: 0; text-transform: uppercase; }
        .team-name { font-size: 1.1rem; letter-spacing: 10px; color: #d4af37; margin: 10px 0 30px 0; }

        .nav-grid { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .nav-btn {
            flex: 1; min-width: 150px; max-width: 180px; padding: 20px 10px;
            border: 1px solid rgba(212, 175, 55, 0.3); background: rgba(255, 255, 255, 0.02);
            text-decoration: none; color: white; transition: 0.4s;
            border-radius: 4px; display: flex; flex-direction: column; align-items: center; cursor: pointer;
        }
        .nav-btn:hover { transform: translateY(-5px); background: rgba(212, 175, 55, 0.1); border-color: #d4af37; }

        /* 相機與暫存彈窗 */
        #camera-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 450px; background: #111; border: 1px solid #d4af37;
            padding: 20px; z-index: 100; border-radius: 15px; text-align: center;
        }
        video, #preview-img { width: 100%; border-radius: 10px; border: 1px solid #333; }
        .controls { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        .btn-ui { padding: 10px 20px; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .btn-main { background: #d4af37; color: #000; }
        .btn-sec { background: #333; color: #fff; }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="content">
        <svg class="chalice-logo" viewBox="0 0 512 512"><path d="M416 32h-320c-17.67 0-32 14.33-32 32v160c0 88.37 71.63 160 160 160v64h-64c-17.67 0-32 14.33-32 32s14.33 32 32 32h224c17.67 0 32-14.33 32-32s-14.33-32-32-32h-64v-64c88.37 0 160-71.63 160-160v-160c0-17.67-14.33-32-32-32zM368 192c0 61.76-50.24 112-112 112s-112-50.24-112-112v-128h224v128z"></path></svg>
        <h1>Underwater Artifact Restoration</h1>
        <div class="team-name">屏東海底探險小隊</div>
        
        <div class="nav-grid">
            <div class="nav-btn" onclick="openCamera()">
                <div style="font-size:24px;">📷</div>
                <span style="margin-top:10px; letter-spacing:2px;">擷取照片</span>
            </div>
            <div id="storage-btn" class="nav-btn" style="opacity: 0.3; cursor: not-allowed;" onclick="uploadStoredImage()">
                <div style="font-size:24px;">💾</div>
                <span style="margin-top:10px; letter-spacing:2px;">暫存並上傳</span>
            </div>
            <a href="https://ocean.si.edu/" target="_blank" class="nav-btn">
                <div style="font-size:24px;">🌊</div>
                <span style="margin-top:10px; letter-spacing:2px;">海底探險</span>
            </a>
            <a href="https://theme.npm.edu.tw/selection/" target="_blank" class="nav-btn">
                <div style="font-size:24px;">🏺</div>
                <span style="margin-top:10px; letter-spacing:2px;">古物珍藏</span>
            </a>
        </div>
    </div>

    <div id="camera-modal">
        <h3 id="modal-title" style="color:#d4af37;">深海視覺系統</h3>
        <video id="video" autoplay playsinline></video>
        <div class="controls">
            <button class="btn-ui btn-main" onclick="captureToStorage()">拍攝並暫存</button>
            <button class="btn-ui btn-sec" onclick="closeCamera()">取消</button>
        </div>
    </div>

    <script>
        let storedBlob = null; // 用來暫存照片的變數
        const video = document.getElementById('video');
        const modal = document.getElementById('camera-modal');
        const storageBtn = document.getElementById('storage-btn');

        async function openCamera() {
            modal.style.display = 'block';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
            } catch (err) { alert("請開啟相機權限"); }
        }

        function captureToStorage() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            // 將圖片轉為 Blob 暫存
            canvas.toBlob((blob) => {
                storedBlob = blob;
                storageBtn.style.opacity = "1";
                storageBtn.style.cursor = "pointer";
                storageBtn.style.borderColor = "#d4af37";
                alert("照片已暫存！現在可以點擊『暫存並上傳』按鈕。");
                closeCamera();
            }, 'image/png');
        }

        async function uploadStoredImage() {
            if (!storedBlob) return;

            // 核心技巧：將暫存圖片放入剪貼簿
            try {
                const item = new ClipboardItem({ "image/png": storedBlob });
                await navigator.clipboard.write([item]);
                
                alert("已自動複製照片！網頁即將開啟，請直接按 Ctrl+V (貼上) 即可開始分析。");
                window.open("https://cleanup.pictures/", "_blank");
            } catch (err) {
                // 如果瀏覽器不支援自動複製圖片，則改用下載法
                const link = document.createElement('a');
                link.href = URL.createObjectURL(storedBlob);
                link.download = "artifact_temp.png";
                link.click();
                window.open("https://cleanup.pictures/", "_blank");
            }
        }

        function closeCamera() {
            const stream = video.srcObject;
            if (stream) stream.getTracks().forEach(t => t.stop());
            modal.style.display = 'none';
        }
    </script>
</body>
</html>
